name: sixam_mart
description: A Multi-vendor Food. Grocery, eCommerce, Pharmacy & Parcel service.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
    git:
      url: https://github.com/luis901101/getx_fork.git
      ref: old-4.7.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2
  zego_uikit_prebuilt_call: ^4.24.1
  zego_uikit_signaling_plugin: ^2.8.21

  firebase_auth: ^6.1.0
  path_provider: ^2.1.5
  pin_code_fields: ^8.0.1
  geolocator: ^14.0.2
  google_maps_flutter: ^2.13.1
  google_maps_flutter_web: ^0.5.14+2
  flutter_typeahead: ^5.2.0
  carousel_slider: ^5.1.2
  shimmer_animation: ^2.2.2
  camera: ^0.10.5
  image_picker: ^1.2.0
  image_picker_ios: ^0.8.13
  universal_html: ^2.2.4
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  http: ^1.5.0
  pointer_interceptor: ^0.10.1+2
  phone_numbers_parser: ^9.0.15
  country_code_picker: ^3.4.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  web: ^1.1.1
  photo_view: ^0.15.0
  dotted_border: ^3.1.0
  share_plus: ^12.0.0
  expandable_bottom_sheet: ^1.1.1+1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  flutter_facebook_auth: ^7.1.2
  sign_in_with_apple: ^7.0.1

  intl: ^0.20.2
  just_the_tooltip: ^0.0.12
  flutter_slidable: ^4.0.3
  animated_flip_counter: ^0.3.4
  youtube_player_iframe: ^5.2.2
  card_swiper: ^3.0.1
  audioplayers: ^6.5.1
  video_player: ^2.10.0
  flutter_svg: ^2.2.1
  flutter_widget_from_html_core: ^0.17.0
  sliver_tools: ^0.2.12

  smooth_page_indicator: ^1.2.1
  chewie: ^1.13.0
  location: ^8.0.1
  drift: ^2.28.2
  drift_flutter: ^0.2.7



  dropdown_button2: ^2.3.9


  file_picker: ^10.3.3
  path: ^1.9.1
  http_parser: ^4.1.2
  vibration: ^3.1.7
  dart_pusher_channels: ^1.2.3
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  flutter_contacts: ^1.1.9
  crypto: ^3.0.3
  google_mlkit_face_detection: ^0.13.1
  mobile_scanner: ^5.2.1

  # ar_flutter_plugin_updated: ^0.0.1  # Replace with the actual latest version
  flutter_markdown: ^0.7.3
  vector_math: ^2.1.4
  flutter_colorpicker: ^1.1.0
  flutter_animate: ^4.5.2
  flutter_avif: ^3.0.0
  app_links: ^7.0.0
  loading_animation_widget: ^1.3.0
  google_map_custom_windows: ^1.1.0
  lottie: ^3.1.2

dependency_overrides:
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  uuid: ^4.5.3
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/map/
    - assets/json/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/font/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/font/Tajawal-Black.ttf
          weight: 900
